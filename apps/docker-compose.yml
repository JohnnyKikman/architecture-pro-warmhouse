version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smarthome-network

  warmhouse-postgres:
    image: postgres:16-alpine
    container_name: warmhouse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5433
    ports:
      - "5433:5433"
    volumes:
      - ./warmhouse-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - warmhouse_postgres_data:/var/lib/postgresql/data
    command: -p 5433
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    networks:
      - smarthome-network

  warmhouse-device-control:
    build:
      context: ./warmhouse-device-control
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      warmhouse-postgres:
        condition: service_started
      app:
        condition: service_started
    networks:
      - smarthome-network

  warmhouse-telemetry:
    build:
      context: ./warmhouse-telemetry
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      warmhouse-postgres:
        condition: service_started
      app:
        condition: service_started
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_started
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:
  warmhouse_postgres_data:

networks:
  smarthome-network:
    driver: bridge